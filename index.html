<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Football_manager</title>
    <link rel="stylesheet" href="css/style.css">
    <meta name="viewport" content="width=device-width, user-scalable=yes, initial-scale=0.1, maximum-scale=2.0, minimum-scale=1.0">
</head>
<body>
    <div class="black" id="black"></div>
    <div class="main_container">
        <div class="wrapper header_container flex-between items_center">
            <header class="items-center">
                <div class="logo">
                    <a href="index.html">
                        <img src="img/logo.png" alt="logo">
                    </a>
                </div>
                <div class="navigation">
                    <ul class="menu" id="menu">
                        <li><a class="cancel" id="cancel" href="#">x</a></li>
                        <li><a href="#">Про нас</a></li>
                        <li><a href="#">Контакти</a></li>
                        <li><a href="#">Івенти</a></li>
                        <li><a href="#">Групи</a></li>
                        <li>
                            <a href="#" class="phone_list items-center">
                                <img src="img/phone.svg" alt="phone icon">
                                +38 050 505 50 55
                            </a>
                        </li>
                    </ul>
                </div>
                <div class="contacts">
                    <a href="#" class="items-center">
                        <img src="img/phone.svg" alt="phone icon">
                        +38 050 505 50 55
                    </a>
                </div>
            </header>
            <div class="burger" id="burger">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
        <main class="flex-between items-center">
            <div class="wrapper">
                <div class="main_text">
                    <p class="level"><i>Знайди свій рівень. Тренуйся як профі</i></p>
                    <h1>Професійні заняття з футболу в Хмельницькому</h1>
                    <p class="slogan">Почни свій футбольний шлях!</p>
                    <p class="cta_container">
                        <a href="#" class="cta">Записатись на заняття</a>
                    </p>
                    <p class="raiting_container">
                        <img src="img/zirochka.svg" alt="five stars">
                        1.200+ задоволених учнівy
                    </p>
                </div>
            </div>
            <picture class="ball_container">
                <source srcset="img/main_ball.webp" type="image/webp">
                <img src="img/ball_big.png" alt="big football ball">
            </picture>
        </main>
    </div>
    <footer>
        <div class="wrapper">
            <div class="graphick">
                <p>Пн-Пт: 8-20:00</p>
                <p>Сб-Нд: 10-19:00</p>
            </div>
            <div class="social_nav">
                <ul class="list_footer flex-between">
                    <li><a href="#"><img src="img/geo.svg" alt="geolocation icon"></a></li>
                    <li><a href="#"><img src="img/inst.svg" alt="instagram icon"></a></li>
                    <li><a href="#"><img src="img/tg.svg" alt="telegram icon"></a></li>
                </ul>
            </div>
            <div class="bottom_logo">
                <a href="index.html">
                    <img src="img/logo_footer0.3.svg" alt="second logo">
                    <p>sinse 2025</p>
                </a>
            </div>
        </div>
    </footer>
    <script>
        burger.onclick = () => {
            menu.style.left = '0'
        }

        black.onclick = () => {
            menu.style.left = '-100%'
        }

        cancel.onclick = (e) => {
            e.preventDefault()
            menu.style.left = '-100%'
        }
    </script>
</body>
</html>
